modLoader = "javafml"
loaderVersion = "[0,)"
license = "LGPL-3.0-only"

[[mods]]
modId = "hbm"
version = "${file.jarVersion}"
displayName = "NTM NEXT"
iconFile = "hbm.png"
iconBlur = true
bannerFile = "hbm.png"
description = "Nuclear Tech Mod, ported to Minecraft ${minecraft_version} for Fabric and NeoForge."
authors = "HbmMods (The Bobcat), movblock"
credits = "HbmMods (The Bobcat): creating the original mod. movblock: porting to 26.2. Raw ore textures: MrNorwood (thorium, cobalt, lithium, schrabidium); Mr. Morgan and NuclearGrandFather (aluminium, beryllium, lead, plutonium, titanium, tungsten, uranium). Copyright HbmMods (The Bobcat), Contributors to Hbm's Nuclear Tech Mod, 2026 movblock <admin@movblock.mov>; the GNU GPL and LGPL texts are LICENSES/GPL-3.0-only.txt and LICENSES/LGPL-3.0-only.txt in this jar."
displayURL = "https://github.com/Warfactory-Official/ntm-next"
displayTest = "IGNORE_ALL_VERSION"
enumExtensions = "META-INF/enumextensions.json"

[[mixins]]
config = "hbm-common.mixins.json"
behaviorVersion = "0.17.4"

[[mixins]]
config = "hbm-iris-compat.mixins.json"
behaviorVersion = "0.17.4"

[[mixins]]
config = "hbm-jigsaw-optimizer.mixins.json"
behaviorVersion = "0.17.4"

[[mixins]]
config = "hbm-network-optimizer.mixins.json"
behaviorVersion = "0.17.4"

[[mixins]]
config = "hbm-replay-timing.mixins.json"
behaviorVersion = "0.17.4"

[[mixins]]
config = "hbm-replay-timing-neoforge.mixins.json"
behaviorVersion = "0.17.4"

[[mixins]]
config = "hbm-neoforge.mixins.json"
behaviorVersion = "0.17.4"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.hbm]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},${minecraft_next_version})"
ordering = "NONE"
side = "BOTH"

[[dependencies.hbm]]
modId = "crankshaft"
type = "required"
versionRange = "[${crankshaft_minimum},)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.hbm]]
modId = "ctm"
type = "optional"
versionRange = "[${ctm_library_version}]"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.hbm]]
modId = "fusion"
type = "optional"
versionRange = "[1.3.13,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.hbm]]
modId = "ae2"
type = "optional"
versionRange = "[${ae2_version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.hbm]]
modId = "scalablelux"
type = "optional"
versionRange = "[0.3.0-alpha.0.16,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hbm]]
modId = "lithium"
type = "optional"
versionRange = "[${lithium_minimum},${lithium_maximum})"
ordering = "NONE"
side = "BOTH"

[[dependencies.hbm]]
modId = "sophisticatedcore"
type = "optional"
versionRange = "[${sophisticated_core_minimum},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hbm]]
modId = "sophisticatedstorage"
type = "optional"
versionRange = "[${sophisticated_storage_minimum},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hbm]]
modId = "sophisticatedbackpacks"
type = "optional"
versionRange = "[${sophisticated_backpacks_minimum},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hbm]]
modId = "iris"
type = "incompatible"
versionRange = "(,${iris_minimum}+mc${minecraft_version})"
ordering = "NONE"
side = "CLIENT"

[[dependencies.hbm]]
modId = "sodium"
type = "incompatible"
versionRange = "(,${sodium_minimum}+mc${minecraft_version})"
ordering = "NONE"
side = "CLIENT"

[[dependencies.hbm]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_minimum},${neoforge_maximum})"
ordering = "NONE"
side = "BOTH"
